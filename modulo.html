<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title> Rizne Zulianti Hidayat - 262505006 - Modulus - Kalkulator Modulo</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; flex-direction:column; align-items:center;
         font-family:'Baloo 2','Comic Sans MS',cursive; color:#5a4470; padding:0 12px;
         background:linear-gradient(180deg,#ffe3f1 0%,#d6e9ff 55%,#fff6c9 100%); }
  h1 { font-size:2rem; font-weight:800; margin:16px 0 0; text-align:center;
       background:linear-gradient(90deg,#ff6b6b,#ffa94d,#f5c400,#40c057,#339af0,#9775fa);
       -webkit-background-clip:text; background-clip:text; color:transparent; }
  .sub { margin:0 0 12px; text-align:center; }
  .kartu { width:100%; max-width:440px; background:#fff; border-radius:26px; padding:18px;
           box-shadow:0 8px 0 #f7a8d0, 0 14px 24px rgba(150,90,170,.25); }
  .tab { display:flex; gap:8px; margin-bottom:14px; }
  .tab button { flex:1; font-family:inherit; font-size:.95rem; font-weight:800; padding:8px;
                border:0; border-radius:999px; background:#f1e6ff; color:#8a63c8; cursor:pointer; }
  .tab button.aktif { background:#9775fa; color:#fff; box-shadow:0 3px 0 #6f4fd0; }
  .baris { display:flex; flex-wrap:wrap; align-items:center; gap:4px 8px; margin-bottom:12px; }
  .baris label { width:40px; font-weight:800; text-align:center; font-size:1.2rem; }
  .baris input { flex:1; min-width:0; font-family:inherit; font-size:1.3rem; font-weight:800;
                 padding:8px 14px; border:3px solid #ffd0e6; border-radius:16px; color:#5a4470; outline:none; }
  .baris input:focus { border-color:#ff7eb6; }
  .ket { width:100%; padding-left:48px; font-size:.85rem; line-height:1.3; color:#8a63c8; }
  .ket b { color:#e0559a; }
  #barisB { display:none; }
  .hitung { width:100%; font-family:inherit; font-size:1.2rem; font-weight:800; padding:11px;
            border:0; border-radius:999px; background:#ff7eb6; color:#fff; cursor:pointer;
            box-shadow:0 5px 0 #d9548f; }
  .hitung:active { transform:translateY(3px); box-shadow:0 2px 0 #d9548f; }
  .hasil { margin-top:16px; text-align:center; }
  .ucap { background:#fff0f7; border:3px solid #ffd0e6; border-radius:16px; padding:6px 12px;
          font-weight:800; color:#e0559a; margin:0 auto 8px; max-width:300px; }
  .maskot { width:96px; height:96px; }
  .nama { display:inline-block; font-weight:800; color:#fff; background:#9775fa;
          padding:2px 16px; border-radius:999px; box-shadow:0 3px 0 #6f4fd0; margin-top:2px; }
  .angka { font-size:2.6rem; font-weight:800; color:#e0559a; line-height:1.1; word-break:break-all; }
  .rumus { font-weight:800; color:#339af0; font-size:1.1rem; margin:4px 0; word-break:break-all; }
  .langkah { text-align:left; background:#f6f0ff; border-radius:16px; padding:10px 14px;
             margin-top:10px; font-size:.95rem; line-height:1.5; }
  .kotak { display:flex; flex-wrap:wrap; gap:5px; justify-content:center; margin-top:12px; }
  .kotak span { width:28px; height:28px; border-radius:9px; display:grid; place-items:center;
                font-size:.8rem; font-weight:800; background:#e9f3ff; color:#6b8fb8; }
  .kotak span.pilih { background:#ff7eb6; color:#fff; transform:scale(1.2); box-shadow:0 3px 0 #d9548f; }
  .salah { color:#d6336c; font-weight:800; }

  /* taman bunga matahari */
  .taman { width:100%; max-width:560px; display:flex; justify-content:center; align-items:flex-end;
           gap:2px; margin-top:22px; }
  .bunga { width:20%; max-width:110px; height:auto; overflow:visible;
           transform-origin:50% 100%; animation:goyang 4s ease-in-out infinite alternate; }
  .bunga.kecil { width:15%; max-width:80px; }
  @keyframes goyang { from { transform:rotate(-4deg); } to { transform:rotate(4deg); } }
  .rumput { width:100vw; height:34px; margin-top:-8px; background:#8be28b;
            border-top:8px solid #a4eaa4; }
  @media (prefers-reduced-motion: reduce) { .bunga { animation:none; } }
</style>
</head>
<body>
<h1>Kalkulator Modulo</h1>
<p class="sub">Dibantu Modulus, si kelinci pintar</p>

<div class="kartu">
  <div class="tab">
    <button id="tabSisa" class="aktif">Sisa bagi</button>
    <button id="tabKong">Kongruen</button>
  </div>

  <div class="baris">
    <label for="a">a</label>
    <input id="a" type="text" inputmode="numeric" placeholder="contoh: 17">
    <div class="ket" id="ketA"></div>
  </div>
  <div class="baris" id="barisB">
    <label for="b">b</label>
    <input id="b" type="text" inputmode="numeric" placeholder="contoh: 2">
    <div class="ket" id="ketB"></div>
  </div>
  <div class="baris">
    <label for="n">n</label>
    <input id="n" type="text" inputmode="numeric" placeholder="contoh: 5">
    <div class="ket" id="ketN"></div>
  </div>

  <button class="hitung" id="hitung">Hitung!</button>

  <div class="hasil">
    <div class="ucap" id="ucap"></div>
    <svg class="maskot" id="maskot" viewBox="0 0 100 100" aria-hidden="true"></svg>
    <div class="nama">Modulus</div>
    <div id="keluaran"></div>
  </div>
</div>

<div class="taman" aria-hidden="true">
  <svg class="bunga kecil" viewBox="0 0 100 160" style="animation-delay:-1s"></svg>
  <svg class="bunga" viewBox="0 0 100 160" style="animation-delay:-2.5s"></svg>
  <svg class="bunga kecil" viewBox="0 0 100 160" style="animation-delay:-.5s"></svg>
  <svg class="bunga" viewBox="0 0 100 160" style="animation-delay:-3s"></svg>
  <svg class="bunga kecil" viewBox="0 0 100 160" style="animation-delay:-1.8s"></svg>
</div>
<div class="rumput"></div>

<script>
let mode = 'sisa';
const $ = id => document.getElementById(id);

// ----- Keterangan a, b, n (berubah sesuai mode) -----
function isiKeterangan() {
  if (mode === 'sisa') {
    $('ketA').innerHTML = '<b>a</b> = bilangan yang akan dibagi';
    $('ketN').innerHTML = '<b>n</b> = pembagi (modulus), harus lebih dari 0';
  } else {
    $('ketA').innerHTML = '<b>a</b> = bilangan pertama yang dibandingkan';
    $('ketB').innerHTML = '<b>b</b> = bilangan kedua yang dibandingkan';
    $('ketN').innerHTML = '<b>n</b> = pembagi (modulus), harus lebih dari 0. Cek apakah a dan b punya sisa yang sama saat dibagi n.';
  }
}

// ----- Bunga matahari -----
function isiBunga() {
  let s = '<path d="M50 62 C50 100 50 130 50 160" stroke="#4caf50" stroke-width="6" fill="none" stroke-linecap="round"/>';
  s += '<ellipse cx="34" cy="118" rx="17" ry="8" fill="#5cc45f" transform="rotate(-30 34 118)"/>';
  s += '<ellipse cx="66" cy="132" rx="17" ry="8" fill="#5cc45f" transform="rotate(30 66 132)"/>';
  for (let i = 0; i < 12; i++)
    s += '<ellipse cx="50" cy="19" rx="7" ry="15" fill="#ffb703" transform="rotate(' + i * 30 + ' 50 45)"/>';
  for (let i = 0; i < 12; i++)
    s += '<ellipse cx="50" cy="22" rx="6.5" ry="13" fill="#ffd60a" transform="rotate(' + (i * 30 + 15) + ' 50 45)"/>';
  s += '<circle cx="50" cy="45" r="17" fill="#8a5a2b"/>';
  s += '<circle cx="50" cy="45" r="13" fill="#6b3f1d"/>';
  s += '<circle cx="44" cy="42" r="2.3" fill="#fff"/><circle cx="56" cy="42" r="2.3" fill="#fff"/>';
  s += '<circle cx="44" cy="42.5" r="1.2" fill="#2e1a0b"/><circle cx="56" cy="42.5" r="1.2" fill="#2e1a0b"/>';
  s += '<ellipse cx="40" cy="49" rx="3" ry="1.8" fill="#ff8fb1" opacity=".7"/>';
  s += '<ellipse cx="60" cy="49" rx="3" ry="1.8" fill="#ff8fb1" opacity=".7"/>';
  s += '<path d="M46 49 q4 4 8 0" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round"/>';
  return s;
}
document.querySelectorAll('.bunga').forEach(el => { el.innerHTML = isiBunga(); });

// ----- Maskot Modulus -----
function maskot(suasana) {
  const kata = {
    biasa: 'Halo! Aku Modulus. Ayo hitung sisa bagi!',
    senang: 'Yeay, berhasil! Aku Modulus, si jago sisa!',
    bingung: 'Hmm, ada yang kurang pas. Cek lagi, ya!'
  };
  $('ucap').textContent = kata[suasana];
  const mata = suasana === 'bingung'
    ? '<circle cx="36" cy="48" r="5" fill="#4a3555"/><circle cx="64" cy="48" r="8" fill="#4a3555"/><circle cx="66" cy="45" r="2.5" fill="#fff"/>'
    : suasana === 'senang'
    ? '<path d="M30 50q6-9 12 0M58 50q6-9 12 0" stroke="#4a3555" stroke-width="4" fill="none" stroke-linecap="round"/>'
    : '<ellipse cx="36" cy="48" rx="5.5" ry="7" fill="#4a3555"/><ellipse cx="64" cy="48" rx="5.5" ry="7" fill="#4a3555"/><circle cx="34" cy="45" r="2" fill="#fff"/><circle cx="62" cy="45" r="2" fill="#fff"/>';
  const mulut = suasana === 'bingung'
    ? '<path d="M42 70q8-6 16 0" stroke="#4a3555" stroke-width="3" fill="none" stroke-linecap="round"/>'
    : suasana === 'senang'
    ? '<path d="M40 64q10 14 20 0z" fill="#c2395f"/>'
    : '<path d="M43 64q7 8 14 0" stroke="#4a3555" stroke-width="3" fill="none" stroke-linecap="round"/>';
  const bintang = suasana === 'senang' ? '<text x="6" y="22" font-size="16">⭐</text><text x="78" y="26" font-size="16">✨</text>' : '';
  $('maskot').innerHTML =
    '<ellipse cx="30" cy="22" rx="10" ry="20" fill="#ff8fb1" transform="rotate(-15 30 22)"/>' +
    '<ellipse cx="70" cy="22" rx="10" ry="20" fill="#ff8fb1" transform="rotate(15 70 22)"/>' +
    '<ellipse cx="30" cy="24" rx="4" ry="12" fill="#ffd0df" transform="rotate(-15 30 24)"/>' +
    '<ellipse cx="70" cy="24" rx="4" ry="12" fill="#ffd0df" transform="rotate(15 70 24)"/>' +
    '<ellipse cx="50" cy="60" rx="38" ry="32" fill="#ff8fb1"/>' +
    '<ellipse cx="50" cy="70" rx="22" ry="17" fill="#ffd0df"/>' +
    mata +
    '<ellipse cx="22" cy="62" rx="7" ry="4" fill="#ff5a8c" opacity=".45"/>' +
    '<ellipse cx="78" cy="62" rx="7" ry="4" fill="#ff5a8c" opacity=".45"/>' +
    mulut + bintang;
}

// ----- Perhitungan (BigInt, aman untuk angka besar) -----
function ambilInt(teks) {
  const s = teks.trim().replace(/\s+/g, '');
  if (!/^-?\d+$/.test(s)) return null;
  return BigInt(s);
}
function mod(a, n) { return ((a % n) + n) % n; }

function tampilSalah(pesan) {
  maskot('bingung');
  $('keluaran').innerHTML = '<p class="salah">' + pesan + '</p>';
}

function hitung() {
  const a = ambilInt($('a').value);
  const n = ambilInt($('n').value);
  if (a === null) return tampilSalah('Isi a (bilangan yang dibagi) dengan bilangan bulat, ya.');
  if (n === null) return tampilSalah('Isi n (pembagi) dengan bilangan bulat, ya.');
  if (n <= 0n) return tampilSalah('n harus lebih besar dari 0.');

  if (mode === 'sisa') {
    const r = mod(a, n);
    const q = (a - r) / n;
    let html = '<div class="rumus">' + a + ' mod ' + n + ' =</div><div class="angka">' + r + '</div>' +
      '<div class="langkah"><b>Langkahnya:</b><br>' +
      a + ' = ' + n + ' × ' + q + ' + ' + r + '<br>' +
      'Jadi hasil bagi = ' + q + ' dan sisanya = <b>' + r + '</b>.' +
      (a < 0n ? '<br>Karena a negatif, sisa dibuat tetap tidak negatif (0 sampai ' + (n - 1n) + ').' : '') +
      '</div>';
    if (n <= 24n) {
      html += '<div class="kotak">';
      for (let i = 0n; i < n; i++) html += '<span class="' + (i === r ? 'pilih' : '') + '">' + i + '</span>';
      html += '</div>';
    }
    $('keluaran').innerHTML = html;
    maskot('senang');
  } else {
    const b = ambilInt($('b').value);
    if (b === null) return tampilSalah('Isi b (bilangan kedua) dengan bilangan bulat, ya.');
    const ra = mod(a, n), rb = mod(b, n);
    const sama = ra === rb;
    $('keluaran').innerHTML =
      '<div class="rumus">' + a + ' ≡ ' + b + ' (mod ' + n + ')</div>' +
      '<div class="angka">' + (sama ? 'Benar!' : 'Salah') + '</div>' +
      '<div class="langkah"><b>Langkahnya:</b><br>' +
      a + ' mod ' + n + ' = ' + ra + '<br>' +
      b + ' mod ' + n + ' = ' + rb + '<br>' +
      (sama ? 'Sisanya sama, jadi keduanya kongruen.'
            : 'Sisanya beda, jadi keduanya tidak kongruen.') +
      '</div>';
    maskot(sama ? 'senang' : 'bingung');
  }
}

// ----- Tab -----
function setMode(m) {
  mode = m;
  $('tabSisa').classList.toggle('aktif', m === 'sisa');
  $('tabKong').classList.toggle('aktif', m === 'kong');
  $('barisB').style.display = m === 'kong' ? 'flex' : 'none';
  $('keluaran').innerHTML = '';
  isiKeterangan();
  maskot('biasa');
}
$('tabSisa').onclick = () => setMode('sisa');
$('tabKong').onclick = () => setMode('kong');
$('hitung').onclick = hitung;
['a', 'b', 'n'].forEach(id => $(id).addEventListener('keydown', e => { if (e.key === 'Enter') hitung(); }));

isiKeterangan();
maskot('biasa');
</script>
</body>
</html>
