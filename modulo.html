<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title> Rizne Zulianti Hidayat - 262505006 o</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; flex-direction:column; align-items:center;
         font-family:'Baloo 2','Comic Sans MS',cursive; color:#5a4470; padding:0 12px 28px;
         background:linear-gradient(160deg,#ffd6ec,#d6e9ff 55%,#d8ffe0); }
  h1 { font-size:2rem; font-weight:800; margin:16px 0 0; text-align:center;
       background:linear-gradient(90deg,#ff6b6b,#ffa94d,#f5c400,#40c057,#339af0,#9775fa);
       -webkit-background-clip:text; background-clip:text; color:transparent; }
  .sub { margin:0 0 12px; text-align:center; }
  .kartu { width:100%; max-width:440px; background:#fff; border-radius:26px; padding:18px;
           box-shadow:0 8px 0 #f7a8d0, 0 14px 24px rgba(150,90,170,.25); }
  .tab { display:flex; gap:8px; margin-bottom:14px; }
  .tab button { flex:1; font-family:inherit; font-size:.95rem; font-weight:800; padding:8px;
                border:0; border-radius:999px; background:#f1e6ff; color:#8a63c8; cursor:pointer; }
  .tab button.aktif { background:#9775fa; color:#fff; box-shadow:0 3px 0 #6f4fd0; }
  .baris { display:flex; align-items:center; gap:8px; margin-bottom:12px; }
  .baris label { width:40px; font-weight:800; text-align:center; font-size:1.2rem; }
  .baris input { flex:1; min-width:0; font-family:inherit; font-size:1.3rem; font-weight:800;
                 padding:8px 14px; border:3px solid #ffd0e6; border-radius:16px; color:#5a4470; outline:none; }
  .baris input:focus { border-color:#ff7eb6; }
  #barisB { display:none; }
  .hitung { width:100%; font-family:inherit; font-size:1.2rem; font-weight:800; padding:11px;
            border:0; border-radius:999px; background:#ff7eb6; color:#fff; cursor:pointer;
            box-shadow:0 5px 0 #d9548f; }
  .hitung:active { transform:translateY(3px); box-shadow:0 2px 0 #d9548f; }
  .hasil { margin-top:16px; text-align:center; }
  .maskot { width:96px; height:96px; }
  .angka { font-size:2.6rem; font-weight:800; color:#e0559a; line-height:1.1; word-break:break-all; }
  .rumus { font-weight:800; color:#339af0; font-size:1.1rem; margin:4px 0; word-break:break-all; }
  .langkah { text-align:left; background:#f6f0ff; border-radius:16px; padding:10px 14px;
             margin-top:10px; font-size:.95rem; line-height:1.5; }
  .kotak { display:flex; flex-wrap:wrap; gap:5px; justify-content:center; margin-top:12px; }
  .kotak span { width:28px; height:28px; border-radius:9px; display:grid; place-items:center;
                font-size:.8rem; font-weight:800; background:#e9f3ff; color:#6b8fb8; }
  .kotak span.pilih { background:#ff7eb6; color:#fff; transform:scale(1.2); box-shadow:0 3px 0 #d9548f; }
  .salah { color:#d6336c; font-weight:800; }
</style>
</head>
<body>
<h1>Kalkulator Modulo</h1>
<p class="sub">Cari sisa bagi dengan mudah</p>

<div class="kartu">
  <div class="tab">
    <button id="tabSisa" class="aktif">Sisa bagi</button>
    <button id="tabKong">Kongruen</button>
  </div>

  <div class="baris"><label for="a">a</label><input id="a" type="text" inputmode="numeric" placeholder="contoh: 17"></div>
  <div class="baris" id="barisB"><label for="b">b</label><input id="b" type="text" inputmode="numeric" placeholder="contoh: 2"></div>
  <div class="baris"><label for="n">n</label><input id="n" type="text" inputmode="numeric" placeholder="contoh: 5"></div>

  <button class="hitung" id="hitung">Hitung!</button>

  <div class="hasil">
    <svg class="maskot" id="maskot" viewBox="0 0 100 100" aria-hidden="true"></svg>
    <div id="keluaran"></div>
  </div>
</div>

<script>
let mode = 'sisa';
const $ = id => document.getElementById(id);

// ----- Maskot -----
function maskot(suasana) {
  const mata = suasana === 'bingung'
    ? '<circle cx="36" cy="48" r="5" fill="#4a3555"/><circle cx="64" cy="48" r="8" fill="#4a3555"/><circle cx="66" cy="45" r="2.5" fill="#fff"/>'
    : suasana === 'senang'
    ? '<path d="M30 50q6-9 12 0M58 50q6-9 12 0" stroke="#4a3555" stroke-width="4" fill="none" stroke-linecap="round"/>'
    : '<ellipse cx="36" cy="48" rx="5.5" ry="7" fill="#4a3555"/><ellipse cx="64" cy="48" rx="5.5" ry="7" fill="#4a3555"/><circle cx="34" cy="45" r="2" fill="#fff"/><circle cx="62" cy="45" r="2" fill="#fff"/>';
  const mulut = suasana === 'bingung'
    ? '<path d="M42 70q8-6 16 0" stroke="#4a3555" stroke-width="3" fill="none" stroke-linecap="round"/>'
    : suasana === 'senang'
    ? '<path d="M40 64q10 14 20 0z" fill="#c2395f"/>'
    : '<path d="M43 64q7 8 14 0" stroke="#4a3555" stroke-width="3" fill="none" stroke-linecap="round"/>';
  const bintang = suasana === 'senang' ? '<text x="6" y="22" font-size="16">⭐</text><text x="78" y="26" font-size="16">✨</text>' : '';
  $('maskot').innerHTML =
    '<ellipse cx="30" cy="22" rx="10" ry="20" fill="#ff8fb1" transform="rotate(-15 30 22)"/>' +
    '<ellipse cx="70" cy="22" rx="10" ry="20" fill="#ff8fb1" transform="rotate(15 70 22)"/>' +
    '<ellipse cx="30" cy="24" rx="4" ry="12" fill="#ffd0df" transform="rotate(-15 30 24)"/>' +
    '<ellipse cx="70" cy="24" rx="4" ry="12" fill="#ffd0df" transform="rotate(15 70 24)"/>' +
    '<ellipse cx="50" cy="60" rx="38" ry="32" fill="#ff8fb1"/>' +
    '<ellipse cx="50" cy="70" rx="22" ry="17" fill="#ffd0df"/>' +
    mata +
    '<ellipse cx="22" cy="62" rx="7" ry="4" fill="#ff5a8c" opacity=".45"/>' +
    '<ellipse cx="78" cy="62" rx="7" ry="4" fill="#ff5a8c" opacity=".45"/>' +
    mulut + bintang;
}

// ----- Perhitungan (BigInt, aman untuk angka besar) -----
function ambilInt(teks) {
  const s = teks.trim().replace(/\s+/g, '');
  if (!/^-?\d+$/.test(s)) return null;
  return BigInt(s);
}
function mod(a, n) { return ((a % n) + n) % n; }

function tampilSalah(pesan) {
  maskot('bingung');
  $('keluaran').innerHTML = '<p class="salah">' + pesan + '</p>';
}

function hitung() {
  const a = ambilInt($('a').value);
  const n = ambilInt($('n').value);
  if (a === null) return tampilSalah('Isi a dengan bilangan bulat, ya.');
  if (n === null) return tampilSalah('Isi n dengan bilangan bulat, ya.');
  if (n <= 0n) return tampilSalah('n harus lebih besar dari 0.');

  if (mode === 'sisa') {
    const r = mod(a, n);
    const q = (a - r) / n;
    let html = '<div class="rumus">' + a + ' mod ' + n + ' =</div><div class="angka">' + r + '</div>' +
      '<div class="langkah"><b>Langkahnya:</b><br>' +
      a + ' = ' + n + ' × ' + q + ' + ' + r + '<br>' +
      'Jadi hasil bagi = ' + q + ' dan sisanya = <b>' + r + '</b>.' +
      (a < 0n ? '<br>Karena a negatif, sisa dibuat tetap tidak negatif (0 sampai ' + (n - 1n) + ').' : '') +
      '</div>';
    if (n <= 24n) {
      html += '<div class="kotak">';
      for (let i = 0n; i < n; i++) html += '<span class="' + (i === r ? 'pilih' : '') + '">' + i + '</span>';
      html += '</div>';
    }
    $('keluaran').innerHTML = html;
    maskot('senang');
  } else {
    const b = ambilInt($('b').value);
    if (b === null) return tampilSalah('Isi b dengan bilangan bulat, ya.');
    const ra = mod(a, n), rb = mod(b, n);
    const sama = ra === rb;
    $('keluaran').innerHTML =
      '<div class="rumus">' + a + ' ≡ ' + b + ' (mod ' + n + ')</div>' +
      '<div class="angka">' + (sama ? 'Benar!' : 'Salah') + '</div>' +
      '<div class="langkah"><b>Langkahnya:</b><br>' +
      a + ' mod ' + n + ' = ' + ra + '<br>' +
      b + ' mod ' + n + ' = ' + rb + '<br>' +
      (sama ? 'Sisanya sama, jadi keduanya kongruen.'
            : 'Sisanya beda, jadi keduanya tidak kongruen.') +
      '</div>';
    maskot(sama ? 'senang' : 'bingung');
  }
}

// ----- Tab -----
function setMode(m) {
  mode = m;
  $('tabSisa').classList.toggle('aktif', m === 'sisa');
  $('tabKong').classList.toggle('aktif', m === 'kong');
  $('barisB').style.display = m === 'kong' ? 'flex' : 'none';
  $('keluaran').innerHTML = '';
  maskot('biasa');
}
$('tabSisa').onclick = () => setMode('sisa');
$('tabKong').onclick = () => setMode('kong');
$('hitung').onclick = hitung;
['a', 'b', 'n'].forEach(id => $(id).addEventListener('keydown', e => { if (e.key === 'Enter') hitung(); }));

maskot('biasa');
</script>
</body>
</html>
